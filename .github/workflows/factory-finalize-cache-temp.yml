name: Temporary Factory finalize cache verify

on:
  push:
    branches:
      - fix/factory-final-confirm-stage5-7
    paths:
      - .github/workflows/factory-finalize-cache-temp.yml
      - tools/factory-finalize-cache-temp.py

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/factory-final-confirm-stage5-7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 tools/factory-finalize-cache-temp.py
      - run: npm run ready:test
      - run: npm run build
      - run: npm run native:verify
      - name: Commit reviewed fix
        run: |
          git config user.name 'MetroBummin'
          git config user.email 'iamthefreeman@naver.com'
          git add server/ready/index.ts ready/admin/app.js tests/verify-ready-workbook-factory.mjs
          git commit -m 'fix: persist validated Factory preview through finalization'
          git push origin HEAD:fix/factory-final-confirm-stage5-7
