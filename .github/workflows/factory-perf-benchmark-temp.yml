name: Temporary factory performance benchmark

on:
  push:
    branches:
      - fix/factory-546-performance
    paths:
      - .github/workflows/factory-perf-benchmark-temp.yml

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/factory-546-performance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare baseline module
        run: git show 71ad429e39fce94dd0f731537e6cf18e9da09d2c:server/ready/workbook-factory.mjs > /tmp/workbook-factory-baseline.mjs
      - name: Baseline
        run: node tools/factory-perf-benchmark-temp.mjs /tmp/workbook-factory-baseline.mjs
      - name: Optimized
        run: node tools/factory-perf-benchmark-temp.mjs server/ready/workbook-factory.mjs
