name: Reader panel QA
on:
  push:
    branches: [codex/reader-word-panel-ime]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source for isolated regression testing
        run: git archive --format=tar.gz HEAD -o /tmp/ready-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ready-reader-source
          path: /tmp/ready-source.tar.gz
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - run: npm run build
      - run: npm run native:verify
