name: Reader panel QA
on:
  push:
    branches: [codex/reader-word-panel-ime]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Archive locked dependencies for isolated regression testing
        run: tar -czf /tmp/ready-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: ready-reader-dependencies
          path: /tmp/ready-dependencies.tar.gz
          retention-days: 1
      - run: npm run test:all
      - run: npm run build
      - run: npm run native:verify
