name: Temporary admin PDF upload verify

on:
  push:
    branches:
      - fix/admin-pdf-file-detection
    paths:
      - .github/workflows/admin-pdf-input-temp.yml
      - tools/admin-pdf-input-temp.py

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-pdf-file-detection
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 tools/admin-pdf-input-temp.py
      - run: npm run ready:test
      - run: npm run build
      - run: npm run native:verify
      - name: Commit PDF upload fix
        run: |
          git config user.name 'MetroBummin'
          git config user.email 'iamthefreeman@naver.com'
          git add ready/admin/app.js ready/admin/index.html tests/verify-ready-workbook-factory.mjs
          git commit -m 'fix: read selected Factory PDF directly'
          git push origin HEAD:fix/admin-pdf-file-detection
