name: Temporary PR verify
on:
  push:
    branches: [fix/workbook-source-stage6-7]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit real publisher PDF
        run: node --input-type=module -e "import {readFileSync} from 'node:fs'; import {extractUnicodePdfText} from './server/ready/pdf-text-extract.mjs'; import {inspectFullWorkbookText} from './server/ready/workbook-factory.mjs'; const b=readFileSync('./ready/workbooks/ne-minbyeongcheon-lesson-1.pdf').toString('base64'); const t=await extractUnicodePdfText(b); const a=inspectFullWorkbookText(t); console.log(JSON.stringify({reviewRequired:a.reviewRequired,incompleteStages:a.incompleteStages,counts:Object.fromEntries([5,6,7].map(s=>[s,a.exercises.filter(x=>({verb_form:5,grammar_vocab_choice:6,error_correction:7}[x.type]===s&&x.provenance?.origin==='publisher_answer_key').length])),stage7:a.exercises.filter(x=>x.type==='error_correction'&&x.provenance?.origin==='publisher_answer_key').map(x=>({n:x.number,sourceNumber:x.sourceNumber,subtype:x.subtype,pairs:x.answers?.length/2,start:x.canonicalStart,end:x.canonicalEnd}))},null,2));"
      - run: npm run ready:test
      - run: npm run build
      - run: npm run native:verify
