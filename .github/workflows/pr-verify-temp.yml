name: Temporary PR verify
on:
  push:
    branches: [fix/workbook-source-stage6-7]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit real publisher PDF
        run: |
          cat > /tmp/audit.mjs <<'EOF'
          import { readFileSync } from 'node:fs';
          import { extractUnicodePdfText } from '/home/runner/work/ready/ready/server/ready/pdf-text-extract.mjs';
          import { inspectFullWorkbookText } from '/home/runner/work/ready/ready/server/ready/workbook-factory.mjs';
          const source = readFileSync('/home/runner/work/ready/ready/ready/workbooks/ne-minbyeongcheon-lesson-1.pdf').toString('base64');
          const text = await extractUnicodePdfText(source);
          const audit = inspectFullWorkbookText(text);
          const stageFor = {verb_form:5,grammar_vocab_choice:6,error_correction:7};
          const publisher = audit.exercises.filter(item => item.provenance?.origin === 'publisher_answer_key');
          console.log(JSON.stringify({
            reviewRequired: audit.reviewRequired,
            incompleteStages: audit.incompleteStages,
            counts: Object.fromEntries([5,6,7].map(stage => [stage, publisher.filter(item => stageFor[item.type] === stage).length])),
            stage7: publisher.filter(item => item.type === 'error_correction').map(item => ({number:item.number,sourceNumber:item.sourceNumber,subtype:item.subtype,pairCount:item.answers?.length/2,canonicalStart:item.canonicalStart,canonicalEnd:item.canonicalEnd}))
          }, null, 2));
          EOF
          node /tmp/audit.mjs
      - run: npm run ready:test
      - run: npm run build
      - run: npm run native:verify
