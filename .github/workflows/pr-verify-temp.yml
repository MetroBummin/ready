name: Temporary PR verify
on:
  push:
    branches: [fix/workbook-source-stage6-7]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply narrow source-parser follow-up
        shell: python
        run: |
          from pathlib import Path

          factory = Path('server/ready/workbook-factory.mjs')
          text = factory.read_text()
          old = "const number = Number(starts[index][1]), start = starts[index].index + starts[index][0].length - 3, end = index + 1 < starts.length ? starts[index + 1].index : section.length, itemText = section.slice(start, end), pairs = [...itemText.matchAll(/\\((\\d+)\\)\\s*([\\s\\S]*?)\\s*(?:→|->|⇒)\\s*([\\s\\S]*?)(?=\\(\\d+\\)\\s*|$)/g)].map(match => [clean(match[2]), clean(match[3])]).filter(pair => pair[0] && pair[1] && !sameOption(pair[0], pair[1]));"
          new = "const number = Number(starts[index][1]), start = starts[index].index + starts[index][0].length, end = index + 1 < starts.length ? starts[index + 1].index : section.length, itemText = `(1) ${section.slice(start, end)}`, pairs = [...itemText.matchAll(/\\((\\d+)\\)\\s*([\\s\\S]*?)\\s*(?:→|->|⇒)\\s*([\\s\\S]*?)(?=\\(\\d+\\)\\s*|$)/g)].map(match => [clean(match[2]), clean(match[3])]).filter(pair => pair[0] && pair[1] && !sameOption(pair[0], pair[1]));"
          if old not in text:
              raise SystemExit('stage7 answer parser target not found')
          text = text.replace(old, new, 1)
          old = "const inlineExercises = blocks.flatMap(block => numberedPairs(block.body).map(item => ({ ...item, type: semanticWorkbookType(block.title), page: block.page, label: block.title }))), publisherExercises = canonicalRows.length ? [...publisherGrammarExercises(text, rows), ...publisherStage7Exercises(text, rows)] : [], exercises = [...publisherExercises, ...inlineExercises], answeredExercises = exercises.filter(item => clean(item.answer) || (Array.isArray(item.answers) && item.answers.length));"
          new = "const inlineExercises = blocks.flatMap(block => numberedPairs(block.body).map(item => ({ ...item, type: semanticWorkbookType(block.title), page: block.page, label: block.title }))), publisherExercises = canonicalRows.length ? [...publisherGrammarExercises(text, rows), ...publisherStage7Exercises(text, rows)] : [], publisherStages = new Set(publisherExercises.map(item => sourceStage(item.type)).filter(Boolean)), exercises = [...publisherExercises, ...inlineExercises.filter(item => !publisherStages.has(sourceStage(item.type)))], answeredExercises = exercises.filter(item => clean(item.answer) || (Array.isArray(item.answers) && item.answers.length));"
          if old not in text:
              raise SystemExit('publisher exercise merge target not found')
          factory.write_text(text.replace(old, new, 1))

          edge = Path('server/ready/index.ts')
          text = edge.read_text()
          old = 'sourceKind === "pdf" ? inspectFullWorkbookText(sourceText) : sourceText ?'
          new = 'sourceKind === "pdf" ? inspectFullWorkbookText(sourceText, existingMode ? existingContext.canonicalRows : null) : sourceText ?'
          if old not in text:
              raise SystemExit('factoryStart inspection target not found')
          edge.write_text(text.replace(old, new, 1))
      - name: Commit parser follow-up if needed
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add server/ready/workbook-factory.mjs server/ready/index.ts
            git commit -m "fix: match publisher workbook source ranges"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ready:test
      - run: npm run build
      - run: npm run native:verify
