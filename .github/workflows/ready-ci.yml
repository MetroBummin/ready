name: READY CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ready-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ready:test
      - run: npm run build
      - run: npm run native:verify
