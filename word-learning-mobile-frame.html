</head><body data-ready-mode="student"><h1>Reader / Mobile</h1><p class="meta">390 PX · LARGE TEXT PRESSURE</p><p class="mobile-copy">Customers can benefit <span class="reader-inline-replacement"><button class="reader-inline-gloss">서비스를 구독함으로써</button><button class="reader-inline-save-toggle">✓</button></span> instead of buying every item.</p><p class="mobile-copy">Saved words remain readable: <button class="reader-inline-source" data-word-saved="true" data-memory-level="1">updates</button>, <button class="reader-inline-source" data-word-saved="true" data-memory-level="2">content</button>, and <button class="reader-inline-source" data-word-saved="true" data-memory-level="3">support</button>.</p><section class="mobile-review word-review-dashboard"><h2>Review</h2><nav class="word-review-nav"><button class="word-review-tab is-active"><span>WORD</span><b>127</b></button><button class="word-review-tab"><span>SENTENCE</span><b>18</b></button><button class="word-review-tab"><span>WORKBOOK</span><b>7</b></button><button class="word-review-tab"><span>QUESTION</span><b>4</b></button></nav><div class="word-review-list"><article class="word-review-item"><div class="word-review-summary"><strong class="word-review-lemma">subscribe</strong><span class="word-review-meaning">구독하다</span><span class="word-review-memory">LEVEL 3</span><button class="word-review-expand">＋</button></div></article></div></section></body></html>
