<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>READY Admin · 고려에듀</title>
    <meta name="theme-color" content="#F6F6F3" media="(prefers-color-scheme:light)" />
    <meta name="theme-color" content="#171713" media="(prefers-color-scheme:dark)" />
    <link rel="icon" href="../../assets/favicon/icon-192.png?v=monofy-bear-1" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="../../assets/favicon/apple-touch-icon.png?v=monofy-bear-1" />
    <link rel="stylesheet" href="../../styles/fonts.css" />
    <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/base.css" />
    <link rel="stylesheet" href="../../design-tokens.css?v=passage-mastery-1" />
    <link rel="stylesheet" href="../ready.css?v=sentence-practice-1" />
    <link rel="stylesheet" href="../design.css?v=sentence-practice-1" />
    <script defer src="../config.js"></script>
    <script type="module" src="app.js?v=sentence-practice-1"></script>
  </head>
  <body data-ready-mode="admin">
    <div id="app">
      <header id="topbar">
        <button id="logo" class="brand-button" type="button" data-route="students"><img src="../../assets/favicon/icon-192.png" alt=""><span class="mark">READY</span><span class="family">Admin</span></button>
        <nav id="admin-nav" hidden>
          <button class="navbtn on" type="button" data-route="students">학생</button>
          <button class="navbtn" type="button" data-route="passages">문장 세트</button>
          <button class="navbtn" type="button" data-route="scopes">시험범위</button>
        </nav>
        <button id="theme-toggle" class="icon-button" type="button" aria-label="색상 모드 바꾸기">◐</button><button id="admin-logout" class="button quiet small" type="button" hidden>로그아웃</button>
      </header>
      <main>
        <section id="admin-login" class="auth-wrap" aria-labelledby="admin-login-title">
          <form id="admin-login-form" class="card auth-card">
            <img class="auth-bear" src="../../assets/favicon/icon-192.png" width="54" height="54" alt="" aria-hidden="true" />
            <p class="eyebrow">READY ADMIN</p>
            <h1 id="admin-login-title">관리자 로그인</h1>
            <p class="lead">관리자 비밀번호는 로그인할 때 한 번만 서버에서 확인합니다.</p>
            <label><span>관리자 비밀번호</span><input name="password" type="password" autocomplete="current-password" maxlength="200" required /></label>
            <button class="button primary" type="submit">관리자 화면 열기</button>
          </form>
        </section>

        <section class="view" id="v-students">
          <div class="page-head"><div><p class="eyebrow">STUDENTS</p><h1>학생과 연습 현황</h1></div><button id="refresh-admin" class="button quiet" type="button">새로고침</button></div>
          <details class="student-create-panel">
            <summary>+ 학생 추가</summary>
            <form id="create-student-form" class="form-grid student-create-school">
              <label><span>학생 이름</span><input name="name" maxlength="40" required /></label>
              <label><span>학교</span><select name="school" required><option value="신흥고">신흥고</option><option value="동고">동고</option><option value="중앙고">중앙고</option><option value="한빛고">한빛고</option><option value="test">test (QA)</option><option value="test2">test2 (QA)</option></select></label>
              <label><span>학년</span><select name="grade" required><option value="1학년">1학년</option><option value="2학년">2학년</option><option value="3학년">3학년</option></select></label>
              <label><span>학생 코드</span><input name="code" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="new-password" placeholder="직접 정한 6자리" required /></label>
              <button class="button primary" type="submit">학생 추가</button>
            </form>
          </details>
          <div class="learning-toolbar">
            <div class="learning-periods" role="group" aria-label="학습 기간">
              <button type="button" data-learning-period="today">오늘</button>
              <button class="active" type="button" data-learning-period="7d">최근 7일</button>
              <button type="button" data-learning-period="30d">최근 30일</button>
            </div>
          </div>
          <div id="student-table"><div class="empty">학생 현황을 불러오는 중입니다.</div></div>
        </section>

        <section class="view" id="v-passages">
          <div class="page-head"><div><p class="eyebrow">SENTENCE SETS</p><h1>문장 세트</h1></div><div class="page-actions"><button class="button primary" type="button" data-new-passage>+ 새 문장 세트</button></div></div>
          <div id="passage-library"></div>
        </section>

        <section class="view" id="v-passage-editor">
          <div class="page-head"><div><button type="button" class="back-link" data-route="passages"><span aria-hidden="true">‹</span> 문장 세트</button><p class="eyebrow">SENTENCE SET</p><h1 id="passage-page-title">문장 세트</h1></div></div>
          <form id="passage-form" class="card form-card">
            <input type="hidden" name="passageId" />
            <div class="form-grid">
              <label><span>제목</span><input name="title" maxlength="120" required /></label>
              <label><span>학년</span><select name="grade" required><option>1학년</option><option>2학년</option><option>3학년</option></select></label>
              <label><span>종류</span><select name="sourceType"><option value="TEXTBOOK">교과서</option><option value="MOCK_EXAM">모의고사</option></select></label>
              <label><span>연도 (모의고사)</span><input name="sourceYear" inputmode="numeric" maxlength="4" /></label>
              <label><span>월 (모의고사)</span><input name="sourceMonth" inputmode="numeric" maxlength="2" /></label>
            </div>
            <label><span>문장 (한 줄에 한 문장: English[TAB]Korean)</span><textarea name="rows" rows="16" required placeholder="The cat sat on the mat.&#9;고양이가 매트 위에 앉았다."></textarea><small>기존 문장을 고치면 같은 문장 ID와 연습 기록이 유지됩니다. 줄을 지우면 그 문장은 비활성화됩니다.</small></label>
            <div class="page-actions"><button class="button primary" type="submit">저장</button><button class="button quiet" type="button" data-delete-passage hidden>삭제</button></div>
          </form>
        </section>

        <section class="view" id="v-scopes">
          <div class="page-head"><div><p class="eyebrow">CURRENT SCOPE</p><h1>시험범위</h1></div></div>
          <p class="lead">학교·학년마다 학생이 연습할 문장 세트를 고릅니다. 같은 학년의 문장 세트만 배정할 수 있습니다.</p>
          <div id="scope-list"></div>
        </section>
      </main>
    </div>
    <div id="busy" class="busy" hidden><span class="spinner"></span><span>잠시만요…</span></div>
    <div id="toast" role="status"></div>
  </body>
</html>
