<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../styles/fonts.css">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../design-tokens.css">
  <link rel="stylesheet" href="../ready/ready.css">
  <link rel="stylesheet" href="../ready/design.css?v=word-order-practice-mode-1">
  <title>Workbook order geometry regression</title>
</head>
<body data-ready-mode="student">
<main>
  <div class="workbook-layout">
    <section class="workbook-card">
      <div class="workbook-prompt order-task">
        <span class="workbook-order-group" data-workbook-order-group="0">
          <span class="workbook-order-built"><em>단어를 순서대로 누르세요</em></span>
          <span class="workbook-order-bank">
            <span class="workbook-order-bank-slot"><button type="button">criminals</button></span>
            <span class="workbook-order-bank-slot"><button type="button">never</button></span>
            <span class="workbook-order-bank-slot"><button type="button">leave</button></span>
            <span class="workbook-order-bank-slot"><button type="button">a crime scene</button></span>
          </span>
        </span>
        <span>without</span>
        <span class="workbook-order-group" data-workbook-order-group="1">
          <span class="workbook-order-built"><em>단어를 순서대로 누르세요</em></span>
          <span class="workbook-order-bank">
            <span class="workbook-order-bank-slot"><button type="button">leaving behind</button></span>
            <span class="workbook-order-bank-slot"><button type="button">traces</button></span>
            <span class="workbook-order-bank-slot"><button type="button">of</button></span>
            <span class="workbook-order-bank-slot"><button type="button">their presence</button></span>
          </span>
        </span>.
      </div>
      <output id="geometry-result">ready</output>
    </section>
  </div>
</main>
<script>
  function stabilize(){document.querySelectorAll('.workbook-order-group').forEach(group=>{const bank=group.querySelector('.workbook-order-bank'),built=group.querySelector('.workbook-order-built'),style=getComputedStyle(built),chrome=Number.parseFloat(style.paddingTop)+Number.parseFloat(style.paddingBottom)+Number.parseFloat(style.borderTopWidth)+Number.parseFloat(style.borderBottomWidth);group.style.setProperty('--workbook-order-stable-height',`${Math.ceil(bank.getBoundingClientRect().height+chrome)}px`);});}
  function rects(){return [...document.querySelectorAll('.workbook-order-bank-slot')].map(node=>{const r=node.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height};});}
  function same(a,b){return a.length===b.length&&a.every((r,i)=>['x','y','width','height'].every(key=>Math.abs(r[key]-b[i][key])<1));}
  window.runGeometryRegression=()=>{stabilize();const before=rects(),group=document.querySelector('[data-workbook-order-group="0"]'),slots=[...group.querySelectorAll('.workbook-order-bank-slot')],built=group.querySelector('.workbook-order-built'),selected=[],usedStates=[];built.querySelector('em')?.remove();for(const slot of slots.slice(0,3)){const button=slot.querySelector('button');built.append(document.createTextNode(`${button.textContent} `));slot.classList.add('used');button.disabled=true;button.setAttribute('aria-pressed','true');selected.push(rects());usedStates.push({disabled:button.disabled,pressed:button.getAttribute('aria-pressed'),opacity:getComputedStyle(button).opacity,visible:button.getClientRects().length>0});}built.replaceChildren(Object.assign(document.createElement('em'),{textContent:'단어를 순서대로 누르세요'}));for(const slot of slots){const button=slot.querySelector('button');slot.classList.remove('used');button.disabled=false;button.setAttribute('aria-pressed','false');}const restored=rects(),pass=selected.every(state=>same(before,state))&&same(before,restored)&&usedStates.every(state=>state.disabled&&state.pressed==='true'&&state.opacity==='0.42'&&state.visible),result={pass,before,selected,usedStates,restored},output=document.querySelector('#geometry-result');output.textContent=pass?'PASS':'FAIL';output.dataset.details=JSON.stringify(result);return result;};
  window.runPracticeFeedbackRegression=()=>{const group=document.querySelector('[data-workbook-order-group="0"]'),slot=group.querySelectorAll('.workbook-order-bank-slot')[2],button=slot.querySelector('button'),before=rects(),beforeBorder=getComputedStyle(button).borderColor;slot.classList.add('wrong');button.disabled=false;button.setAttribute('aria-pressed','false');button.setAttribute('aria-invalid','true');const during=rects(),duringBorder=getComputedStyle(button).borderColor;slot.classList.remove('wrong');button.removeAttribute('aria-invalid');const restored=rects(),pass=same(before,during)&&same(before,restored)&&button.disabled===false&&button.getAttribute('aria-pressed')==='false'&&duringBorder!==beforeBorder;return {pass,before,during,restored,beforeBorder,duringBorder};};
  addEventListener('load',()=>requestAnimationFrame(()=>{const geometry=window.runGeometryRegression(),feedback=window.runPracticeFeedbackRegression(),output=document.querySelector('#geometry-result');output.textContent=geometry.pass&&feedback.pass?'PASS':'FAIL';output.dataset.details=JSON.stringify({geometry,feedback});}));
</script>
</body>
</html>
