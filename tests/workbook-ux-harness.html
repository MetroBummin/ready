<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles/tokens.css"><link rel="stylesheet" href="/styles/base.css"><link rel="stylesheet" href="/design-tokens.css"><link rel="stylesheet" href="/ready/ready.css"><link rel="stylesheet" href="/ready/design.css"><title>Workbook UX Harness</title></head>
<body data-ready-mode="student" class="dark"><main><section class="workbook-layout"><section class="workbook-card">
<p class="workbook-instruction">8단계 · 순서 배열</p><blockquote>경고: 가짜 뉴스 주의!</blockquote>
<div class="workbook-prompt order-task"><span class="workbook-order-group" data-workbook-order-group="0"><span class="workbook-order-built"><em>단어를 순서대로 누르세요</em></span><span class="workbook-order-bank"><span class="workbook-order-bank-slot"><button type="button">Warning:</button></span><span class="workbook-order-bank-slot"><button type="button">Fake</button></span><span class="workbook-order-bank-slot"><button type="button">News</button></span></span></span></div>
</section><section class="workbook-card"><p class="workbook-instruction">9단계 · 영작</p><blockquote>소셜 미디어를 스크롤하던 중</blockquote><div class="workbook-prompt"><span class="workbook-blank" style="--workbook-slot-ch:24"><input id="typing" type="text" placeholder="직접 영작하세요"><small class="workbook-live-copy" hidden><span></span><b></b></small></span></div></section></section></main>
<script type="module">import{livePrefixState,sha256Browser}from'/ready/workbook-assistance.js';const answer='While scrolling',salt='harness',prefixHashes=[];for(let i=1;i<=answer.toLowerCase().length;i++)prefixHashes.push(await sha256Browser(`${salt}:${answer.toLowerCase().slice(0,i)}`));const verifier={salt,normalizedLength:answer.length,prefixHashes};const group=document.querySelector('.workbook-order-group'),built=group.querySelector('.workbook-order-built'),style=getComputedStyle(built),chrome=parseFloat(style.paddingTop)+parseFloat(style.paddingBottom)+parseFloat(style.borderTopWidth)+parseFloat(style.borderBottomWidth);group.style.setProperty('--workbook-order-stable-height',`${Math.ceil(group.querySelector('.workbook-order-bank').getBoundingClientRect().height+chrome)}px`);group.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;const slot=button.closest('.workbook-order-bank-slot');if(slot){slot.classList.add('used');if(built.querySelector('em'))built.innerHTML='';const chip=button.cloneNode(true);built.append(chip);}else{const label=button.textContent;button.remove();[...group.querySelectorAll('.workbook-order-bank button')].find(item=>item.textContent===label)?.closest('.workbook-order-bank-slot')?.classList.remove('used');if(!built.children.length)built.innerHTML='<em>단어를 순서대로 누르세요</em>';}});document.querySelector('#typing').addEventListener('input',async event=>{const input=event.target,state=await livePrefixState(input.value,verifier),copy=input.parentElement.querySelector('.workbook-live-copy');input.parentElement.classList.toggle('live-mismatch',!state.valid);copy.hidden=state.valid;if(!state.valid){copy.querySelector('span').textContent=input.value.slice(0,state.mismatchIndex);copy.querySelector('b').textContent=input.value.slice(state.mismatchIndex);}});</script></body></html>
