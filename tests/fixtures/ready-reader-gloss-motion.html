<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/design-tokens.css">
  <link rel="stylesheet" href="/ready/design.css">
  <title>READY Word Lookup motion fixture</title>
</head>
<body data-ready-mode="student">
  <main id="fixture" data-reader-passage-id="motion-fixture" style="width:min(760px,calc(100% - 32px));margin:48px auto">
    <p class="reading-passage"><span class="reader-inline-sentence" data-reader-sentence-id="reader-1"></span></p>
    <section class="question-answer-area" style="margin-top:32px">
      <div class="question-choice" role="radio" aria-checked="false">
        <span class="question-choice-mark">①</span>
        <span class="question-choice-copy"><span class="reader-inline-sentence" data-reader-sentence-id="choice-1"></span></span>
      </div>
    </section>
    <p class="reader-inline-notice" data-reader-gloss-notice hidden></p>
    <span class="sr-only" data-reader-gloss-live aria-live="polite"></span>
  </main>
  <script type="module">
    import {createReaderInlineGloss,readerSentenceMarkup} from '/ready/reader-inline-gloss.js';
    const sentences=[
      {id:'reader-1',text:'She enjoys discovering new songs by subscribing to the service and will take part in the project.'},
      {id:'choice-1',text:'The subscription provides extraordinarily detailed recommendations for every student.'}
    ];
    const root=document.querySelector('#fixture');
    for(const sentence of sentences)root.querySelector(`[data-reader-sentence-id="${sentence.id}"]`).innerHTML=readerSentenceMarkup(sentence);
    const firstSentence=root.querySelector('[data-reader-sentence-id="reader-1"]'),stableFirst=firstSentence.firstChild;
    stableFirst.dataset.qaStable='yes';
    const meaningFor=({sentenceId,start,end,sourceText})=>{
      const sentence=sentences.find(item=>item.id===sentenceId),clicked=sourceText.toLowerCase();
      if(clicked==='part'){const phrase='take part in',phraseStart=sentence.text.indexOf(phrase);return {start:phraseStart,end:phraseStart+phrase.length,sourceText:phrase,meaning:'참여하다',lemma:'part',kind:'phrase'};}
      const meanings={discovering:['발견하다','새롭게 찾아내다'],subscription:['매우 상세한 정기 구독 서비스'],provides:['제공하다'],extraordinarily:['이례적으로']},meaning=(meanings[clicked]||[`${clicked} 뜻`])[0];
      return {start,end,sourceText,meaning,lemma:clicked.replace(/ing$/,'').replace(/s$/,''),kind:'word'};
    };
    let retryCount=0;
    try{
      createReaderInlineGloss({root,passage:{id:'motion-fixture',updated_at:'v1'},sentences,savedWords:[{id:'saved-subscribe',lemma:'subscribe',meaning:'구독하다',memoryLevel:2}],request:data=>new Promise(resolve=>setTimeout(()=>{const result=meaningFor(data);if(data.retry&&result.lemma==='discover')result.meaning=++retryCount%2?'새롭게 찾아내다':'발견하다';resolve({resolved:true,eventId:`event-${Date.now()}`,sentenceId:data.sentenceId,confidence:.99,...result});},650)),saveWord:async({lemma})=>({saved:true,savedWordId:`saved-${lemma}`,lemma,meaning:'발견하다',memoryLevel:1}),removeWord:async()=>({saved:false})});
      root.dataset.qaReady='true';
      window.__readyGlossQA={sentence:()=>firstSentence,stableNode:()=>stableFirst,identityPreserved:()=>firstSentence.firstChild===stableFirst,overflow:()=>document.documentElement.scrollWidth-document.documentElement.clientWidth};
    }catch(error){root.dataset.qaError=String(error?.stack||error);window.__readyGlossError=String(error?.stack||error);}
  </script>
</body>
</html>
